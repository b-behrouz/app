name: Verify local HTML
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/build_preview.py --check
      - run: python3 scripts/build_pages.py --check
      - run: python3 scripts/check_project.py
      - run: node tests/test_center_server.cjs
      - run: node tests/test_center_origin.cjs
      - run: python3 -m unittest discover -s tests -p test_security.py
      - run: python3 -m unittest discover -s tests -p test_pages_build.py
      - run: python3 -m unittest discover -s tests -p test_hosting.py
      - run: python3 scripts/build_hosting.py --output work/hosting
      - name: Select runner Chrome or install pinned Playwright browser
        run: |
          runner_chrome=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$runner_chrome" ]; then
            echo "CHROMIUM_PATH=$runner_chrome" >> "$GITHUB_ENV"
            "$runner_chrome" --version
          else
            npx playwright install chromium
          fi
      - run: node tests/test_center_browser.cjs
      - run: node tests/test_form_alerts.cjs
      - run: node tests/test_local_preview.cjs
      - run: node tests/test_pages.cjs
      - run: node tests/test_hosting_browser.cjs
      - name: Verify actual live Pages URL after publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        timeout-minutes: 8
        run: node tests/test_live_pages.cjs
      - name: Store live verification evidence
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hamghadam-live-qa
          path: work/live-qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hamghadam-local-html
          path: hamghadam-preview.html
          retention-days: 14
