name: Verify local HTML
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/check_project.py
      - run: node tests/test_center_server.cjs
      - run: python3 -m unittest discover -s tests -p test_security.py
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_center_browser.cjs
      - run: node tests/test_local_preview.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hamghadam-local-html
          path: hamghadam-preview.html
          retention-days: 14
