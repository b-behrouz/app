# REVIEW ONLY; merge with the NEW domain's existing rules after host/root review.
# Canonical categories have physical index.html files; they need no SPA rewrite.
RewriteEngine On
RewriteRule ^categories/nurses/?$ / [R=301,END,QSD]
RewriteCond %{QUERY_STRING} ^category=nurses$
RewriteRule ^$ / [R=301,END,QSD]
RewriteCond %{QUERY_STRING} ^category=(hospitals|pharmacies)$
RewriteRule ^$ /categories/%1/ [R=301,END,QSD]
RewriteCond %{QUERY_STRING} ^category=care$
RewriteRule ^$ / [R=301,END,QSD]
RewriteCond %{QUERY_STRING} !^$
RewriteRule ^$ seo/noindex.html [END]
ErrorDocument 404 /404.html
# The OLD-domain redirect belongs to its separately reviewed vhost/root.
